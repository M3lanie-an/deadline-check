<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deadline Check — Can You Spot the Bad Science?</title>
<meta name="description" content="An interactive simulation about sourcing decisions on deadline. Built by the STATS Lab at Claremont McKenna College.">
<meta property="og:title" content="Deadline Check — Can You Spot the Bad Science?">
<meta property="og:description" content="You're a reporter on deadline. Three stories, three sourcing decisions. Every citation you choose shapes what millions of readers believe.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,600;0,9..144,700;0,9..144,800;1,9..144,400&family=IBM+Plex+Mono:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #1a1a18;
  --paper: #faf9f6;
  --surface: #f0efeb;
  --rule: #ddd9d0;
  --dim: #7a766e;
  --muted-bg: #f0efeb;
  --accent: #1a4a7a;
  --alert: #b5302a;
  --alert-bg: #fdecea;
  --alert-border: #f5c6c2;
  --mono: 'IBM Plex Mono', 'JetBrains Mono', monospace;
  --display: 'Fraunces', 'Playfair Display', Georgia, serif;
  --body: 'Newsreader', 'Source Serif 4', Georgia, serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  font-family: var(--body);
  background: var(--paper);
  color: var(--ink);
  min-height: 100vh;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}

::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 3px; }

a { color: var(--accent); }
a:hover { opacity: 0.7; }
button { border: none; background: none; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

@keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
@keyframes slideIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
@keyframes pulse { 0%, 100% { opacity: .4; } 50% { opacity: 1; } }
@keyframes ticker { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

#app-wrap { max-width: 620px; margin: 0 auto; padding: 0 16px; }

/* ── Hero image ── */
.hero {
  position: relative;
  width: 100vw;
  margin-left: 50%;
  transform: translateX(-50%);
  height: 200px;
  background-size: cover;
  background-position: center;
  display: flex;
  align-items: flex-end;
  margin-bottom: 0;
}
.hero::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(to bottom, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.15) 60%, rgba(250,249,246,1) 100%);
}
.hero-text {
  position: relative;
  z-index: 1;
  padding: 0 16px 20px;
  max-width: 620px;
  margin: 0 auto;
  width: 100%;
}
.hero-beat {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 3px;
  color: rgba(255,255,255,0.85);
  margin-bottom: 6px;
  font-weight: 700;
}
.hero-headline {
  font-family: var(--display);
  font-size: 20px;
  font-weight: 700;
  line-height: 1.2;
  color: #fff;
  text-shadow: 0 1px 8px rgba(0,0,0,0.3);
}

/* ── Title screen hero ── */
.title-hero {
  position: relative;
  width: 100vw;
  margin-left: 50%;
  transform: translateX(-50%);
  height: 260px;
  background-size: cover;
  background-position: center;
}
.title-hero::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(to bottom, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.15) 60%, rgba(250,249,246,1) 100%);
}

/* ── Progress dots ── */
.progress { display: flex; gap: 8px; align-items: center; margin-bottom: 28px; }
.dot {
  height: 8px; border-radius: 4px;
  transition: all 0.4s cubic-bezier(0.23,1,0.32,1);
}
.dot.active { width: 28px; background: var(--ink); }
.dot.inactive { width: 8px; background: var(--rule); }
.progress-label { font-family: var(--mono); font-size: 10px; color: var(--dim); margin-left: 8px; }

/* ── Deadline badge ── */
.deadline-badge {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 8px 16px; border-radius: 4px; margin-bottom: 24px;
  font-family: var(--mono); font-size: 11px; font-weight: 600; letter-spacing: 1px;
}
.deadline-badge.urgent { background: var(--alert-bg); border: 1px solid var(--alert-border); color: var(--alert); }
.deadline-badge.normal { background: var(--muted-bg); border: 1px solid var(--rule); color: var(--dim); }
.pulse-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--alert); animation: pulse 1.5s infinite;
}

/* ── Story context ── */
.story-context {
  border-left: 3px solid var(--ink); padding-left: 20px; margin-bottom: 28px;
}
.story-beat { font-family: var(--mono); font-size: 10px; letter-spacing: 3px; color: var(--dim); margin-bottom: 6px; font-weight: 700; }
.story-headline { font-family: var(--display); font-size: 22px; font-weight: 700; line-height: 1.2; color: var(--ink); margin-bottom: 8px; }
.story-editor { font-size: 14px; color: var(--dim); font-style: italic; line-height: 1.5; }

/* ── Narrative / typewriter ── */
.narrative { font-size: 16px; line-height: 1.8; color: var(--dim); margin-bottom: 32px; }
.narrative p { margin: 0 0 14px; }
.narrative p:empty { min-height: 14px; }
.skip-hint { opacity: 0.35; font-family: var(--mono); font-size: 10px; font-style: italic; }

/* ── Feedback banner ── */
.feedback { padding: 18px 22px; border-radius: 8px; margin-bottom: 28px; animation: slideIn 0.4s ease; }
.feedback-label { font-family: var(--mono); font-size: 10px; letter-spacing: 2px; font-weight: 700; margin-bottom: 6px; }
.feedback-detail { font-size: 14px; line-height: 1.55; }

/* ── Source cards ── */
.source-card {
  background: var(--paper); border: 1.5px solid var(--rule);
  border-radius: 8px; padding: 24px; margin-bottom: 12px;
  transition: all 0.4s cubic-bezier(0.23,1,0.32,1), border-color 0.2s;
  opacity: 0; transform: translateY(12px);
}
.source-card.visible { opacity: 1; transform: translateY(0); }
.source-card:hover { border-color: var(--ink); }
.source-journal { font-family: var(--mono); font-size: 10px; letter-spacing: 1.5px; color: var(--dim); margin-bottom: 8px; font-weight: 600; }
.source-title { font-family: var(--display); font-size: 17px; font-weight: 600; line-height: 1.35; color: var(--ink); margin-bottom: 8px; }
.source-authors { font-size: 13px; color: var(--dim); margin-bottom: 16px; }
.details-toggle {
  background: none; border: none; padding: 0; cursor: pointer;
  font-family: var(--mono); font-size: 11px; color: var(--accent);
  letter-spacing: 0.5px; font-weight: 600; margin-bottom: 16px; display: block;
}
.details-grid {
  display: grid; grid-template-columns: 1fr; gap: 10px 20px;
  padding: 16px; background: var(--surface); border-radius: 6px;
  margin-bottom: 16px; animation: fadeUp 0.25s ease;
}
.detail-key { font-family: var(--mono); font-size: 9px; letter-spacing: 1.5px; color: var(--dim); margin-bottom: 3px; text-transform: uppercase; }
.detail-val { font-size: 13px; font-weight: 500; line-height: 1.4; }
.detail-val.flagged { color: var(--alert); }
.cite-btn {
  width: 100%; padding: 12px; border-radius: 6px; cursor: pointer;
  font-family: var(--mono); font-size: 12px; font-weight: 700; letter-spacing: 0.5px;
  background: transparent; color: var(--ink);
  border: 1.5px solid var(--ink); transition: all 0.2s;
}
.cite-btn:hover { background: var(--ink); color: var(--paper); }

/* ── Ending ── */
.result-card {
  padding: 36px 28px; border-radius: 12px; margin-bottom: 28px; text-align: center;
}
.result-label { font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: 3px; margin-bottom: 14px; }
.result-headline { font-family: var(--display); font-size: 24px; font-weight: 700; color: var(--ink); margin-bottom: 14px; line-height: 1.2; }
.result-summary { font-size: 15px; color: var(--dim); line-height: 1.65; max-width: 440px; margin: 0 auto; }

.stats-grid {
  display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px;
  background: var(--rule); border-radius: 8px; overflow: hidden; margin-bottom: 24px;
}
.stat-cell { padding: 16px 10px; background: var(--paper); text-align: center; }
.stat-key { font-family: var(--mono); font-size: 9px; letter-spacing: 1.5px; color: var(--dim); margin-bottom: 4px; text-transform: uppercase; }
.stat-val { font-weight: 700; }
.stat-val.number { font-size: 20px; font-family: var(--mono); }
.stat-val.text { font-size: 14px; font-family: var(--body); }
.stat-val.alert { color: var(--alert); }

.path-badges { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 32px; }
.path-badge {
  font-family: var(--mono); font-size: 10px; padding: 4px 12px;
  border-radius: 4px; font-weight: 600;
}
.path-badge.good { background: #edf7ed; color: #1a5c2a; }
.path-badge.bad { background: var(--alert-bg); color: var(--alert); }

/* ── CTA ── */
.cta-block {
  padding: 32px 28px; border-radius: 12px;
  background: var(--ink); color: var(--paper);
  text-align: center; margin-bottom: 24px;
}
.cta-label { font-family: var(--mono); font-size: 10px; letter-spacing: 3px; margin-bottom: 14px; opacity: 0.6; }
.cta-headline { font-family: var(--display); font-size: 20px; font-weight: 700; line-height: 1.3; margin-bottom: 12px; }
.cta-body { font-size: 14px; line-height: 1.65; opacity: 0.8; max-width: 400px; margin: 0 auto 24px; }
.cta-btn {
  display: inline-block; padding: 14px 40px; border-radius: 6px;
  background: var(--paper); color: var(--ink);
  font-family: var(--mono); font-size: 13px; font-weight: 700;
  letter-spacing: 0.5px; text-decoration: none; transition: opacity 0.2s;
}
.cta-btn:hover { opacity: 0.85; color: var(--ink); }

.action-btns { display: flex; gap: 10px; flex-wrap: wrap; }
.btn-primary {
  padding: 12px 28px; font-family: var(--mono); font-size: 12px; font-weight: 700;
  letter-spacing: 0.5px; background: var(--ink); color: var(--paper);
  border: none; border-radius: 6px; cursor: pointer;
}

/* ── Contact form ── */
.contact-form { text-align: left; margin-top: 20px; }
.form-group { margin-bottom: 16px; }
.form-label {
  display: block; font-family: var(--mono); font-size: 10px;
  letter-spacing: 1px; color: rgba(255,255,255,0.6);
  margin-bottom: 6px; font-weight: 600; text-transform: uppercase;
}
.form-label .req { color: rgba(255,255,255,0.35); font-weight: 400; text-transform: none; letter-spacing: 0; }
.form-input {
  width: 100%; padding: 12px 14px; border-radius: 6px;
  border: 1.5px solid rgba(255,255,255,0.15);
  background: rgba(255,255,255,0.08); color: var(--paper);
  font-family: var(--body); font-size: 15px; line-height: 1.5;
  transition: border-color 0.2s;
}
.form-input::placeholder { color: rgba(255,255,255,0.3); }
.form-input:focus { outline: none; border-color: rgba(255,255,255,0.45); }
.form-submit {
  width: 100%; padding: 14px; border-radius: 6px; margin-top: 8px;
  background: var(--paper); color: var(--ink);
  font-family: var(--mono); font-size: 13px; font-weight: 700;
  letter-spacing: 0.5px; border: none; cursor: pointer;
  transition: opacity 0.2s;
}
.form-submit:hover { opacity: 0.85; }
.form-submit:disabled { opacity: 0.5; cursor: not-allowed; }
.form-confirm {
  text-align: center; padding: 24px 0;
  animation: fadeUp 0.4s ease;
}
.form-confirm-check {
  width: 48px; height: 48px; border-radius: 50%;
  background: rgba(255,255,255,0.12); display: inline-flex;
  align-items: center; justify-content: center;
  font-size: 24px; margin-bottom: 16px;
}
.form-confirm-msg {
  font-family: var(--display); font-size: 18px;
  font-weight: 700; margin-bottom: 8px;
}
.form-confirm-sub {
  font-size: 13px; opacity: 0.6; margin-bottom: 20px;
}

/* ── Share buttons ── */
.share-section {
  margin-top: 28px; padding-top: 24px;
  border-top: 1.5px solid var(--rule);
}
.share-label {
  font-family: var(--mono); font-size: 10px; letter-spacing: 2px;
  color: var(--dim); margin-bottom: 14px; font-weight: 700;
}
.share-btns { display: flex; gap: 10px; flex-wrap: wrap; }
.share-btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 10px 18px; border-radius: 6px;
  font-family: var(--mono); font-size: 11px; font-weight: 600;
  letter-spacing: 0.3px; border: 1.5px solid var(--rule);
  background: var(--paper); color: var(--ink);
  cursor: pointer; transition: all 0.2s; text-decoration: none;
}
.share-btn:hover { border-color: var(--ink); color: var(--ink); opacity: 1; }
.share-btn svg { width: 16px; height: 16px; flex-shrink: 0; }
.share-copied {
  font-family: var(--mono); font-size: 11px;
  color: #1a7a42; font-weight: 600; padding: 10px 0;
  animation: fadeUp 0.3s ease;
}


/* ── Title screen ── */
.title-bar {
  background: var(--ink); color: var(--paper); padding: 8px 0;
  font-family: var(--mono); font-size: 10px; letter-spacing: 2px;
  text-align: center; font-weight: 600;
  width: 100vw; margin-left: 50%; transform: translateX(-50%);
}
.title-content { min-height: 75vh; display: flex; flex-direction: column; justify-content: center; }
.title-sub { font-family: var(--mono); font-size: 10px; letter-spacing: 3px; color: var(--dim); margin-bottom: 20px; font-weight: 700; }
.title-h1 {
  font-family: var(--display); font-size: clamp(32px, 7vw, 54px);
  font-weight: 800; line-height: 1.05; margin-bottom: 24px; letter-spacing: -0.5px;
}
.title-h1 em { font-style: italic; }
.title-desc { font-size: 18px; line-height: 1.7; color: var(--dim); margin-bottom: 16px; max-width: 460px; }
.title-meta { font-family: var(--mono); font-size: 12px; color: var(--dim); margin-bottom: 40px; letter-spacing: 0.3px; }
.start-btn {
  padding: 16px 44px; font-size: 13px; font-weight: 700; font-family: var(--mono);
  letter-spacing: 1px; background: var(--ink); color: var(--paper);
  border-radius: 6px; text-transform: uppercase; border: none; cursor: pointer;
}
.title-footer { margin-top: 64px; padding-top: 20px; border-top: 2px solid var(--rule); }
.title-footer p { font-size: 13px; color: var(--dim); line-height: 1.7; }
.title-footer strong { color: var(--ink); }

.sources-label { font-family: var(--mono); font-size: 10px; letter-spacing: 2px; color: var(--dim); margin-bottom: 14px; font-weight: 700; }

.anim-fadeup { animation: fadeUp 0.5s ease; }

/* ── Responsive ── */
@media (min-width: 640px) {
  #app-wrap { padding: 0 24px; }
  .hero { height: 280px; }
  .hero-text { padding: 0 24px 24px; }
  .hero-headline { font-size: 24px; }
  .title-hero { height: 320px; }
  .details-grid { grid-template-columns: 1fr 1fr; }
  .stats-grid { grid-template-columns: repeat(4, 1fr); }
}
</style>
</head>

function getHeroImage(id) {

// ─── HELPERS ─────────────────────────────────────────────────────────

function esc(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function isRedFlag(val) {
  return val.includes("Not") || val.includes("N/A") || val.includes("Google Scholar only") ||
         val.includes("No citations") || val.includes("self-citation") ||
         val.includes("Rapid") || val.includes("Fast") || val.includes("Expedited");
}

function camelToLabel(key) {
  return key.replace(/([A-Z])/g, ' $1').trim();
}

// ─── RENDER FUNCTIONS ────────────────────────────────────────────────

function renderHero(imageUrl, beat, headline) {
  return `
    <div class="hero" style="background-image:url('${imageUrl}')">
      <div class="hero-text">
        <div class="hero-beat">${esc(beat)}</div>
        <div class="hero-headline">${esc(headline)}</div>
      </div>
    </div>`;
}

function renderProgress(phase) {
  const total = 3;
  let dots = '';
  for (let i = 0; i < total; i++) {
    dots += `<div class="dot ${i <= phase ? 'active' : 'inactive'}"></div>`;
  }
  return `<div class="progress">${dots}<span class="progress-label">STORY ${Math.min(phase + 1, total)} OF ${total}</span></div>`;
}

function renderFeedback(fb) {
  const colors = {
    good: { bg: "#edf7ed", border: "#b7ddb7", text: "#1a5c2a" },
    bad: { bg: "#fdecea", border: "#f5c6c2", text: "#8b1a1a" },
    recovery: { bg: "#e8f0fe", border: "#b3cde3", text: "#1a4a7a" }
  };
  const c = colors[fb.type] || colors.recovery;
  return `
    <div class="feedback" style="background:${c.bg};border:1px solid ${c.border}">
      <div class="feedback-label" style="color:${c.text}">${esc(fb.label)}</div>
      <div class="feedback-detail" style="color:${c.text}">${esc(fb.detail)}</div>
    </div>`;
}

function renderDeadlineBadge(text) {
  const isUrgent = text.includes("Deadline") || text.includes("CORRECTION");
  return `
    <div class="deadline-badge ${isUrgent ? 'urgent' : 'normal'}">
      ${isUrgent ? '<span class="pulse-dot"></span>' : ''}
      ${esc(text)}
    </div>`;
}

function renderSourceCard(source, index) {
  const expanded = state.expandedCards[source.id] || false;
  const delay = index * 0.12;

  let detailsHtml = '';
  if (expanded) {
    let cells = '';
    for (const [key, val] of Object.entries(source.details)) {
      const flagged = isRedFlag(val) ? ' flagged' : '';
      cells += `
        <div>
          <div class="detail-key">${esc(camelToLabel(key))}</div>
          <div class="detail-val${flagged}">${esc(val)}</div>
        </div>`;
    }
    detailsHtml = `<div class="details-grid">${cells}</div>`;
  }

  return `
    <div class="source-card${state.sourcesVisible ? ' visible' : ''}"
         style="transition-delay:${delay}s"
         data-source-id="${source.id}">
      <div class="source-journal">${esc(source.journal.toUpperCase())} &middot; ${esc(source.year)}</div>
      <div class="source-title">${esc(source.title)}</div>
      <div class="source-authors">${esc(source.authors)}</div>
      <button class="details-toggle" onclick="toggleDetails('${source.id}')" style="margin-bottom:${expanded ? '14px' : '16px'}">
        ${expanded ? '\u25BE Hide details' : '\u25B8 Check journal details'}
      </button>
      ${detailsHtml}
      <button class="cite-btn" onclick="selectSource('${source.id}')">CITE THIS SOURCE</button>
    </div>`;
}

// ─── TYPEWRITER ──────────────────────────────────────────────────────

function startTypewriter(text) {
  clearInterval(typewriterInterval);
  typewriterIdx = 0;
  const el = document.getElementById('narrative-area');
  if (!el) return;

  el.style.cursor = 'pointer';
  el.onclick = skipTypewriter;
  renderTypewriterFrame(el, text, typewriterIdx);

  typewriterInterval = setInterval(() => {
    if (typewriterIdx < text.length) {
      typewriterIdx++;
      renderTypewriterFrame(el, text, typewriterIdx);
    } else {
      clearInterval(typewriterInterval);
      typewriterInterval = null;
      onTypewriterComplete();
    }
  }, 5);
}

function renderTypewriterFrame(el, text, idx) {
  const visible = text.slice(0, idx);
  const paragraphs = visible.split('\n');
  let html = '';
  paragraphs.forEach(p => {
    html += `<p>${p ? esc(p) : '&nbsp;'}</p>`;
  });
  if (idx < text.length) {
    html += '<span class="skip-hint">click to skip</span>';
  }
  el.innerHTML = html;
}

function skipTypewriter() {
  const scenario = SCENARIOS.find(s => s.id === state.currentId);
  if (!scenario || !scenario.narrative) return;
  clearInterval(typewriterInterval);
  typewriterInterval = null;
  typewriterIdx = scenario.narrative.length;
  const el = document.getElementById('narrative-area');
  if (el) {
    renderTypewriterFrame(el, scenario.narrative, typewriterIdx);
    el.style.cursor = 'default';
    el.onclick = null;
  }
  onTypewriterComplete();
}

function onTypewriterComplete() {
  if (state.textDone) return;
  state.textDone = true;
  const scenario = SCENARIOS.find(s => s.id === state.currentId);
  if (!scenario || !scenario.sources) return;

  const container = document.getElementById('narrative-area');
  if (!container) return;
  const parent = container.parentElement;

  let sourcesDiv = document.getElementById('sources-container');
  if (!sourcesDiv) {
    sourcesDiv = document.createElement('div');
    sourcesDiv.id = 'sources-container';
    parent.appendChild(sourcesDiv);
  }

  let cards = '';
  scenario.sources.forEach((s, i) => {
    cards += renderSourceCard(s, i);
  });
  sourcesDiv.innerHTML = `<div class="sources-label">SELECT A SOURCE TO CITE</div>${cards}`;

  setTimeout(() => {
    state.sourcesVisible = true;
    document.querySelectorAll('.source-card').forEach(card => {
      card.classList.add('visible');
    });
  }, 150);
}

// ─── ACTIONS ─────────────────────────────────────────────────────────

function startGame() {
  state.screen = "game";
  state.currentId = "intro";
  state.history = [];
  state.sourcesVisible = false;
  state.textDone = false;
  state.expandedCards = {};
  render();
}

function selectSource(sourceId) {
  const scenario = SCENARIOS.find(s => s.id === state.currentId);
  if (!scenario || !scenario.sources) return;
  const source = scenario.sources.find(s => s.id === sourceId);
  if (!source) return;

  state.history.push(source.type);
  state.sourcesVisible = false;
  state.textDone = false;
  state.expandedCards = {};

  setTimeout(() => {
    state.currentId = source.next;
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }, 250);
}

function toggleDetails(sourceId) {
  state.expandedCards[sourceId] = !state.expandedCards[sourceId];
  const scenario = SCENARIOS.find(s => s.id === state.currentId);
  if (!scenario || !scenario.sources) return;

  const sourcesDiv = document.getElementById('sources-container');
  if (!sourcesDiv) return;

  let cards = '';
  scenario.sources.forEach((s, i) => {
    cards += renderSourceCard(s, i);
  });
  sourcesDiv.innerHTML = `<div class="sources-label">SELECT A SOURCE TO CITE</div>${cards}`;

  if (state.sourcesVisible) {
    document.querySelectorAll('.source-card').forEach(card => {
      card.classList.add('visible');
    });
  }
}

// ─── MAIN RENDER ─────────────────────────────────────────────────────

function render() {
  clearInterval(typewriterInterval);
  typewriterInterval = null;

  const app = document.getElementById('app-wrap');
  const scenario = SCENARIOS.find(s => s.id === state.currentId);

  if (state.screen === "title") {
    app.innerHTML = renderTitle();
    return;
  }

  if (state.screen === "game" && scenario) {
    if (scenario.ending) {
      app.innerHTML = renderEnding(scenario);
    } else {
      app.innerHTML = renderGame(scenario);
      startTypewriter(scenario.narrative);
    }
  }
}

// ─── CONTACT FORM & SHARING ──────────────────────────────────────

const GOOGLE_FORM_BASE = 'https://docs.google.com/forms/d/e/1FAIpQLSf5EEhtIGjTnRgL-1se2mtBG37Xdv3AdSEIEIbbD5zdzPf-Mg/viewform?usp=pp_url';
const SHARE_URL = window.location.href;
const SHARE_TEXT = 'Can you spot bad research on deadline? Try this simulation from researchers at Claremont McKenna College \u2192';

function submitContactForm(e) {
  e.preventDefault();
  const name = document.getElementById('cf-name').value.trim();
  const email = document.getElementById('cf-email').value.trim();
  const linkedin = document.getElementById('cf-linkedin').value.trim();

  const prefillUrl = GOOGLE_FORM_BASE
    + '&entry.238285547=' + encodeURIComponent(name)
    + '&entry.2106441402=' + encodeURIComponent(email)
    + '&entry.1916001828=' + encodeURIComponent(linkedin);

  window.open(prefillUrl, '_blank', 'noopener,noreferrer');

  const area = document.getElementById('contact-form-area');
  if (area) {
    area.innerHTML = `
      <div class="form-confirm">
        <div class="form-confirm-check">\u2713</div>
        <div class="form-confirm-msg">Thank you \u2014 we'll be in touch.</div>
        <div class="form-confirm-sub">A new tab has opened with the form. Please review and submit it there.</div>
      </div>`;
  }
}

function copyShareLink() {
  navigator.clipboard.writeText(SHARE_URL).then(() => {
    const el = document.getElementById('copy-confirm');
    if (el) {
      el.innerHTML = '<div class="share-copied">\u2713 Link copied to clipboard</div>';
      setTimeout(() => { el.innerHTML = ''; }, 3000);
    }
  }).catch(() => {
    prompt('Copy this link:', SHARE_URL);
  });
}

function shareLinkedIn(e) {
  e.preventDefault();
  const url = 'https://www.linkedin.com/sharing/share-offsite/?url=' + encodeURIComponent(SHARE_URL);
  window.open(url, '_blank', 'noopener,noreferrer,width=600,height=500');
}

function shareTwitter(e) {
  e.preventDefault();
  const url = 'https://twitter.com/intent/tweet?text=' + encodeURIComponent(SHARE_TEXT) + '&url=' + encodeURIComponent(SHARE_URL);
  window.open(url, '_blank', 'noopener,noreferrer,width=600,height=400');
}

// ─── INIT ────────────────────────────────────────────────────────────
render();
</script>
